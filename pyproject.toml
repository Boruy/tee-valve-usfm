[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tee-valve-seg"
version = "0.1.0"
description = "TEE aortic valve segmentation data and USFM fine-tuning tools"
requires-python = ">=3.10"
dependencies = [
  "nibabel>=5,<6",
  "numpy>=2.0.1,<3",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["code"]
